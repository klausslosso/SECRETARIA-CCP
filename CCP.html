<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE CCP - Painel Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b120e;
            --bg-card: rgba(14, 23, 18, 0.88);
            --bg-button: rgba(22, 36, 28, 0.9);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #4ade80;
            --primary-glow: rgba(74, 222, 128, 0.2);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(74, 222, 128, 0.45);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Container do Topo */
        .banner-topo-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            background: #9ec073;
            overflow: hidden;
            padding-bottom: 25px;
        }

        .banner-topo-wrapper img {
            width: 100%;
            max-width: 1100px;
            display: block;
            height: auto;
            position: relative;
            z-index: 1;
        }

        /* Transição suave partindo estritamente abaixo da logo */
        .banner-topo-wrapper::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(11, 18, 14, 0) 0%,
                rgba(11, 18, 14, 0) 80%,
                rgba(11, 18, 14, 0.5) 90%,
                var(--bg-base) 100%
            );
            pointer-events: none;
            z-index: 2;
        }

        /* Fundo de Fusão */
        .fundo-transicao {
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at 50% 200px,
                rgba(85, 122, 49, 0.2) 0%,
                rgba(11, 18, 14, 0.98) 75%
            );
            pointer-events: none;
            z-index: 0;
        }

        /* Card Central dos Módulos - Posicionado abaixo da logo */
        .card { 
            background: var(--bg-card); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 34px 28px; 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            width: 100%; 
            max-width: 520px; 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 3;
            margin: 20px 15px 50px;
        }

        .header-container {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: var(--primary-glow);
            color: var(--primary);
            font-size: 7.5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 5px 14px;
            border-radius: 100px;
            margin-bottom: 10px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        h1 { 
            color: var(--text-main); 
            font-size: 1.35rem; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-size: 0.88rem; 
            font-weight: 500;
        }
        
        .menu-grid { 
            display: flex;
            flex-direction: column;
            gap: 10px; 
        }
        
        .menu-link { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: var(--bg-button); 
            color: var(--text-main); 
            text-decoration: none; 
            padding: 13px 18px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: var(--transition); 
        }
        
        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .arrow-icon {
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: var(--transition);
            opacity: 0.6;
        }
        
        .menu-link:hover { 
            border-color: var(--border-hover);
            background: rgba(30, 48, 38, 0.95);
            box-shadow: 0 0 16px var(--primary-glow);
            transform: translateY(-2px);
        }

        .menu-link:hover .arrow-icon {
            color: var(--primary);
            opacity: 1;
            transform: translateX(4px);
        }

        .menu-link:hover .link-icon {
            background: var(--primary-glow);
        }

        .menu-link.gestao-geral {
            border-left: 3px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="fundo-transicao"></div>

    <!-- Topo com a Logo e Brasão Descobertos -->
    <div class="banner-topo-wrapper">
        <img src="https://raw.githubusercontent.com/klausslosso/logo-ccp/main/topo_ccp.jpg" alt="Centro de Capacitação Profissional - Lahylton Cézar Santana Neves">
    </div>

    <!-- Card Central -->
    <div id="menu-section" class="card">
        <div class="header-container">
            <span class="badge">Ambiente Integrado SGE</span>
            <h1>Painel de Gestão</h1>
            <p class="subtitle">Selecione o módulo operacional para prosseguir</p>
        </div>

        <div class="menu-grid">
            <a href="#" class="menu-link gestao-geral" onclick="return false;" style="cursor: default;">
                <div class="link-content">
                    <span class="link-icon">🏛️</span>
                    <span>Gestão Geral</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/Alunos/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">👥</span>
                    <span>Gestão de Alunos</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/CURSOS/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">📚</span>
                    <span>Cursos e Turmas</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="URL_DA_AREA_DO_ALUNO" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">🎓</span>
                    <span>Área do Aluno</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/INSTRUTOR/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">👔</span>
                    <span>Área do Instrutor</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/Estoque-CCP/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">📦</span>
                    <span>Estoque e Histórico</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/COMUNICA-O/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">💬</span>
                    <span>Comunicação com o Aluno</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>

            <a href="https://klausslosso.github.io/GODMOD/" class="menu-link" target="_blank">
                <div class="link-content">
                    <span class="link-icon">⚙️</span>
                    <span>Administração</span>
                </div>
                <span class="arrow-icon">➔</span>
            </a>
        </div>
    </div>

</body>
</html>
